plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    // ModMenu (config screen integration)
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }

    // Cloth Config
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
    }

    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "cleanchat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // ModMenu integration
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Text Placeholder API
    implementation "eu.pb4:placeholder-api:${project.placeholder_api_version}"

    // Cloth Config
//    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

kotlin {
    jvmToolchain(25)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}